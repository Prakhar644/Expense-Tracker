<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    /* Center the card nicely */
    body.auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #4a90e2, #50c9c3);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Bigger, modern card */
    .auth-card {
      background: #fff;
      width: 420px;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      animation: fadeInUp 0.6s ease-out;
      transform: translateY(20px);
      opacity: 0;
      animation-fill-mode: forwards;
    }

    @keyframes fadeInUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .auth-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
      color: #333;
    }

    .auth-subtitle {
      font-size: 1rem;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #666;
    }

    label {
      font-weight: 500;
      display: block;
      margin-bottom: 0.3rem;
      color: #444;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: box-shadow 0.3s, border-color 0.3s;
      margin-bottom: 1rem;
    }

    input:focus {
      border-color: #4a90e2;
      box-shadow: 0 0 6px rgba(74, 144, 226, 0.5);
      outline: none;
    }

    .pw-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pw-toggle {
      background: none;
      border: none;
      color: #4a90e2;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.3s;
    }

    .pw-toggle:hover {
      color: #357ABD;
    }

    .btn {
      width: 100%;
      padding: 0.9rem;
      background: #4a90e2;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    .btn:hover {
      background-color: #357ABD;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .meta {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
    }

    .meta .link {
      color: #4a90e2;
      font-weight: 500;
      text-decoration: none;
    }

    .meta .link:hover {
      text-decoration: underline;
    }

    /* Flash messages */
    .flash-list {
      margin-bottom: 1rem;
      padding: 0;
      list-style: none;
    }

    .flash.error {
      background: #ffe6e6;
      color: #cc0000;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="auth-container">
  <div class="auth-card fade-in" role="main" aria-labelledby="login-heading">
    <h2 id="login-heading" class="auth-title">Welcome back</h2>
    <p class="lead auth-subtitle">Log in to continue to your account.</p>

    <!-- Flash messages from server -->
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul class="flash-list" aria-live="polite">
      {% for msg in messages %}
      <li class="flash error">{{ msg }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}

    <form id="login-form" method="POST" novalidate>
      <input type="hidden" name="next" value="{{ next }}">

      <div>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required placeholder="Your username"
          autofocus>
      </div>

      <div>
        <label for="password">Password</label>
        <div class="pw-row">
          <input id="password" name="password" type="password" autocomplete="current-password" required
            placeholder="••••••••">
          <button type="button" class="pw-toggle" id="toggle-pw" aria-label="Show password">Show</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="submit-btn" type="submit">
          <span id="btn-text">Login</span>
          <span id="btn-spinner" style="display:none;" aria-hidden="true" class="spinner"></span>
        </button>
      </div>

      <div class="meta">
        <span>New here? <a class="link" href="{{ url_for('signup', next=next) }}">Create account</a></span>
      </div>
    </form>
  </div>

  <!-- If already logged in, send them to `next` immediately -->
  {% if current_user %}
  <script>
    (function () {
      var target = "{{ next or url_for('index') }}";
      try { window.location.replace(target); } catch (e) { /* ignore */ }
    })();
  </script>
  {% endif %}

  <script>
    (function () {
      const form = document.getElementById('login-form');
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      const pw = document.getElementById('password');
      const toggle = document.getElementById('toggle-pw');

      // Show/hide password
      toggle.addEventListener('click', function () {
        const isPw = pw.type === 'password';
        pw.type = isPw ? 'text' : 'password';
        toggle.textContent = isPw ? 'Hide' : 'Show';
        toggle.setAttribute('aria-pressed', String(isPw));
        pw.focus();
      });

      // UX: disable button + spinner while submitting
      form.addEventListener('submit', function (e) {
        if (!form.username.value.trim() || !form.password.value) {
          if (document.querySelector('.flash-list') === null) {
            const ul = document.createElement('ul');
            ul.className = 'flash-list';
            ul.innerHTML = '<li class="flash error">Please fill username and password.</li>';
            form.parentNode.insertBefore(ul, form);
          }
          e.preventDefault();
          return;
        }

        btn.setAttribute('disabled', '');
        spinner.style.display = '';
        btnText.style.opacity = '0.0';
      });

      const username = document.getElementById('username');
      if (username) username.focus();
    })();
  </script>
</body>

</html>
